<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#080808;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="#1C1C1C" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo -->
  <text x="80" y="100" font-family="sans-serif" font-size="32" font-weight="800" fill="#FAFAFA" letter-spacing="-1">
    Gr<tspan fill="url(#g1)">AI</tspan>t Systems
  </text>

  <!-- Main headline -->
  <text x="80" y="220" font-family="sans-serif" font-size="68" font-weight="900" fill="#FAFAFA" letter-spacing="-2">
    Dein Business läuft
  </text>
  <text x="80" y="300" font-family="sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
    <tspan fill="url(#g1)">automatisch.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="380" font-family="sans-serif" font-size="28" fill="#A1A1AA" letter-spacing="-0.5">
    KI-Automation &amp; Websites · Schwerpunkt: Immobilienmakler
  </text>

  <!-- Badge -->
  <rect x="80" y="430" width="280" height="44" rx="22" fill="#111111" stroke="#1C1C1C" stroke-width="1"/>
  <circle cx="108" cy="452" r="6" fill="#F59E0B"/>
  <text x="124" y="457" font-family="sans-serif" font-size="16" fill="#A1A1AA">3 Pilot-Plätze verfügbar</text>

  <!-- CTA -->
  <rect x="80" y="500" width="300" height="52" rx="8" fill="url(#g1)"/>
  <text x="230" y="532" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    30-Min. Analyse buchen →
  </text>

  <!-- Right decoration: widget mockup -->
  <rect x="780" y="80" width="340" height="460" rx="16" fill="#111111" stroke="#1C1C1C" stroke-width="1"/>
  <rect x="780" y="80" width="340" height="1" fill="url(#g1)"/>
  <rect x="800" y="110" width="300" height="44" rx="8" fill="#080808"/>
  <text x="950" y="137" font-family="sans-serif" font-size="13" fill="#52525B" text-anchor="middle">GrAIt · Demo-System</text>
  <circle cx="820" cy="132" r="6" fill="#FF5F57"/>
  <circle cx="836" cy="132" r="6" fill="#FEBC2E"/>
  <circle cx="852" cy="132" r="6" fill="#28C840"/>

  <!-- Stats row -->
  <rect x="800" y="170" width="88" height="70" rx="8" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="844" y="210" font-family="sans-serif" font-size="30" font-weight="800" fill="#FAFAFA" text-anchor="middle">23</text>
  <text x="844" y="230" font-family="sans-serif" font-size="10" fill="#52525B" text-anchor="middle">Verarbeitet</text>

  <rect x="896" y="170" width="88" height="70" rx="8" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="940" y="205" font-family="sans-serif" font-size="30" font-weight="800" fill="url(#g1)" text-anchor="middle">3</text>
  <text x="940" y="230" font-family="sans-serif" font-size="10" fill="#52525B" text-anchor="middle">Heiße Leads</text>

  <rect x="992" y="170" width="88" height="70" rx="8" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="1036" y="205" font-family="sans-serif" font-size="30" font-weight="800" fill="#FAFAFA" text-anchor="middle">89</text>
  <text x="1036" y="230" font-family="sans-serif" font-size="10" fill="#52525B" text-anchor="middle">Ø Sek.</text>

  <!-- Feed items -->
  <rect x="800" y="260" width="300" height="44" rx="6" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="820" y="287" font-family="sans-serif" font-size="13" fill="#A1A1AA">⚡ Antwort in 89 Sek. gesendet</text>

  <rect x="800" y="312" width="300" height="44" rx="6" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="820" y="339" font-family="sans-serif" font-size="13" fill="#A1A1AA">🎯 Lead qualifiziert: 8/10 Punkte</text>

  <rect x="800" y="364" width="300" height="44" rx="6" fill="#080808" stroke="#1C1C1C" stroke-width="1"/>
  <text x="820" y="391" font-family="sans-serif" font-size="13" fill="#A1A1AA">📩 Neue Anfrage eingegangen</text>

  <!-- Footer dot -->
  <circle cx="810" cy="490" r="5" fill="#10B981"/>
  <text x="824" y="494" font-family="sans-serif" font-size="12" fill="#10B981">System aktiv</text>

  <!-- Bottom border -->
  <rect x="0" y="608" width="1200" height="2" fill="url(#g1)" opacity="0.3"/>
  <text x="1120" y="625" font-family="sans-serif" font-size="14" fill="#3F3F46" text-anchor="end">graitsystems.com</text>
